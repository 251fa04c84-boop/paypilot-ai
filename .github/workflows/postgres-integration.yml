name: PostgreSQL integration gates

on:
  push:
    branches: ["codex/paypilot-real-postgres-staging"]
  pull_request:
    branches: ["main", "codex/postgres-request-scoped-repository", "codex/paypilot-real-postgres-staging", "codex/paypilot-password-reset-least-privilege"]

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paypilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paypilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: paypilot_test
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_RUNTIME_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run application unit tests
        run: node --test test/*.test.js
      - name: Create disposable tenant schema and runtime role
        run: psql -v ON_ERROR_STOP=1 -f test/postgres-schema.fixture.sql
      - name: Apply tenant RLS policies
        run: psql -v ON_ERROR_STOP=1 -f migrations/002_tenant_rls.sql
      - name: Install restricted bootstrap lookup functions
        run: psql -v ON_ERROR_STOP=1 -f migrations/003_rls_bootstrap_lookups.sql
      - name: Allow pending PayPal order status
        run: psql -v ON_ERROR_STOP=1 -f migrations/004_paypal_pending_order_status.sql
      - name: Apply private account and session migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/20261110_private_accounts.sql
      - name: Lock down password reset table privileges
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/20261112_password_reset_least_privilege.sql
      - name: Verify restricted private-account and reset-table access
        run: psql -v ON_ERROR_STOP=1 -f test/private-account-migration.integration.sql
      - name: Verify tenant isolation as non-owner runtime role
        run: PGPASSWORD="$TEST_RUNTIME_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U paypilot_staging_runtime -d "$PGDATABASE" -f test/postgres-rls.integration.sql
      - name: Verify concurrent writes and cross-connection persistence
        run: bash test/postgres-concurrency.integration.sh
      - name: Exercise PayPilot HTTP routes against PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://paypilot_staging_runtime:test-only-password@localhost:5432/paypilot_test
        run: node --test test/server-postgres.integration.test.js
