name: PostgreSQL integration gates

on:
  push:
    branches: ["codex/paypilot-real-postgres-staging"]
  pull_request:
    branches: ["main"]

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paypilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paypilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: paypilot_test
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_RUNTIME_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run application unit tests
        run: node --test test/*.test.js
      - name: Create disposable tenant schema and runtime role
        run: psql -v ON_ERROR_STOP=1 -f test/postgres-schema.fixture.sql
      - name: Apply tenant RLS policies
        run: psql -v ON_ERROR_STOP=1 -f migrations/002_tenant_rls.sql
      - name: Verify tenant isolation as non-owner runtime role
        run: PGPASSWORD="$TEST_RUNTIME_PASSWORD" psql -v ON_ERROR_STOP=1 -h "$PGHOST" -U paypilot_staging_runtime -d "$PGDATABASE" -f test/postgres-rls.integration.sql
      - name: Verify concurrent writes and cross-connection persistence
        run: bash test/postgres-concurrency.integration.sh
