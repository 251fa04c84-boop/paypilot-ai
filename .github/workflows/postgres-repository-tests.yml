name: PostgreSQL repository boundary tests

on:
  push:
    branches:
      - codex/postgres-request-scoped-repository
      - codex/paypilot-human-crafted-ui
  pull_request:
    branches:
      - main
      - codex/paypilot-human-crafted-ui

permissions:
  contents: read

concurrency:
  group: paypilot-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete test suite
        run: node --test test/*.test.js
