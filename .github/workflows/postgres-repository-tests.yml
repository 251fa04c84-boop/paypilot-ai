name: PostgreSQL repository boundary tests

on:
  push:
    branches: ["codex/postgres-request-scoped-repository"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.js
