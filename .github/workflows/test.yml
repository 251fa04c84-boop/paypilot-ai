name: Tests

on:
  push:
    branches: ["main", "codex/**", "competition/**"]
  pull_request:
    branches: ["main", "codex/paypilot-human-crafted-ui"]

permissions:
  contents: read

concurrency:
  group: paypilot-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server and browser JavaScript syntax
        run: node --check server.js && node --check public/app.js && node --check lib/email.js
      - name: Run complete test suite
        run: npm test
