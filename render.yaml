services:
  - type: web
    name: paypilot-ai
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PG_STORAGE_MODE
        value: judge_demo
      - key: JUDGE_DEMO_TENANT_ID
        sync: false
